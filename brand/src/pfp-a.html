<!doctype html><meta charset="utf-8">
<style>*{margin:0;padding:0}html,body{width:400px;height:400px;overflow:hidden}</style>
<!-- Full-bleed lime: reads as a bright lime disc once X crops it round.
     No ceiling marker here, deliberately. The square works on the 32px header
     mark where it just thickens the terminus, but at this size it either fuses
     with the stroke into a blob or floats off as a separate flag. The stroke's
     own square cap is a clean angled terminus and cannot go wrong.
     Every extreme point stays inside the inscribed circle (r=200 about 200,200). -->
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="400" fill="#c8ff2e"/>
  <path d="M78 296 C 180 296, 244 262, 300 100" fill="none" stroke="#08080a"
        stroke-width="46" stroke-linecap="square"/>
  <rect x="62" y="279" width="34" height="34" fill="#ff3d8b"/>
</svg>
